name: Build
permissions:
  contents: write
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  VULKAN_VERSION: 1.4.309.0
  LLVM_VERSION: 20
  LLVM_WINDOWS_VERSION: 20.1.4
  LLVM_MACOS_VERSION: 22

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          # `release: true` marks the one configuration per platform that ships in a GitHub release.
          - { runner: windows-2025, os: windows, arch: x64,    toolchain: msvc,     mode: release, runtime: MT, release: true }
          - { runner: windows-2025, os: windows, arch: x64,    toolchain: msvc,     mode: debug,   runtime: MTd }

          # - { runner: windows-2025, os: windows, arch: x64,    toolchain: clang-cl, mode: release, runtime: MT }
          # - { runner: windows-2025, os: windows, arch: x64,    toolchain: clang-cl, mode: debug,   runtime: MTd }

          - { runner: ubuntu-latest,  os: linux,   arch: x86_64, toolchain: clang-20, mode: release, runtime: c++_static, release: true }
          - { runner: ubuntu-latest,  os: linux,   arch: x86_64, toolchain: clang-20, mode: debug,   runtime: c++_static }

          - { runner: macos-26,  os: macos,   arch: arm64, toolchain: mac-clang, mode: release, runtime: c++_static, release: true }
          - { runner: macos-26,  os: macos,   arch: arm64, toolchain: mac-clang, mode: debug,   runtime: c++_static }

    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Get current date as package key
        id: cache_key
        run: echo "key=$(date +'%W')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set OUTPUT_FILE variable
        run: echo "OUTPUT_FILE=${{ matrix.platform.os }}_${{ matrix.platform.arch }}_${{ matrix.platform.mode }}_${{ matrix.platform.toolchain }}_${{ matrix.platform.runtime }}${{ matrix.platform.archive_ext }}" >> $GITHUB_ENV
        shell: bash

      - name: Set package name
        run: echo "PACKAGE_NAME=Pong-${{ matrix.platform.os }}-${{ matrix.platform.arch }}" >> $GITHUB_ENV
        shell: bash

      # Force xmake to a specific folder (for cache)
      - name: Set xmake env
        run: echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/xmake-global" >> $GITHUB_ENV
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: ${{ matrix.platform.os == 'linux' }}
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ env.LLVM_VERSION }} main"
          sudo add-apt-repository -y "deb-src http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ env.LLVM_VERSION }} main"
          sudo apt update -y
          sudo apt install -y clang-${{ env.LLVM_VERSION }} lld-${{ env.LLVM_VERSION }} llvm-${{ env.LLVM_VERSION }} libllvm${{ env.LLVM_VERSION }} llvm-${{ env.LLVM_VERSION }}-runtime libclang-common-${{ env.LLVM_VERSION }}-dev libclang-${{ env.LLVM_VERSION }}-dev libclang1-${{ env.LLVM_VERSION }} libclang-rt-${{ env.LLVM_VERSION }}-dev libc++-${{ env.LLVM_VERSION }}-dev libc++abi-${{ env.LLVM_VERSION }}-dev libunwind-${{ env.LLVM_VERSION }}-dev libllvmlibc-${{ env.LLVM_VERSION }}-dev
          sudo apt install libx11-dev libxext-dev libxrandr-dev libxrender-dev libxfixes-dev libxi-dev libxinerama-dev libxkbcommon-dev

      - name: Set up Python
        if: ${{ matrix.platform.os == 'macos' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install MacOS dependencies
        if: ${{ matrix.platform.os == 'macos' }}
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install LLVM for Windows
        if: ${{ matrix.platform.os == 'windows' }}
        uses: KyleMayes/install-llvm-action@master
        with:
          version: "${{env.LLVM_WINDOWS_VERSION}}"

      - name: Install LLVM for MacOS
        if: ${{ matrix.platform.os == 'macos' }}
        run: |
          brew install llvm@${{ env.LLVM_MACOS_VERSION }}
          LLVM_PATH=$(brew --prefix llvm@${{ env.LLVM_MACOS_VERSION }})
          echo "LLVM_PATH=$LLVM_PATH" >> $GITHUB_ENV
          echo "PATH=$LLVM_PATH/bin:$PATH" >> $GITHUB_ENV
          echo "LDFLAGS=-L$LLVM_PATH/lib/c++ -Wl,-rpath,$LLVM_PATH/lib/c++ $LDFLAGS" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$LLVM_PATH/include $CPPFLAGS" >> $GITHUB_ENV
          echo "CXXFLAGS=-stdlib=libc++ $CXXFLAGS" >> $GITHUB_ENV

      - name: Verify LLVM version
        if: ${{ matrix.platform.os == 'macos' }}
        run: |
          which clang++
          clang++ --version
          echo "LLVM_PATH: $LLVM_PATH"
          echo "LDFLAGS: $LDFLAGS"
          echo "CPPFLAGS: $CPPFLAGS"
          echo "CXXFLAGS: $CXXFLAGS"
          brew --prefix llvm@${{ env.LLVM_MACOS_VERSION }}

      # Install xmake
      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: .xmake-cache-W${{ steps.cache_key.outputs.key }}

      # Update xmake repository (in order to have the file that will be cached)
      - name: Update xmake repository
        run: xmake repo --update -vD

      # Fetch xmake dephash
      - name: Retrieve dependencies hash
        id: dep_hash
        run: echo "hash=$(xmake l utils.ci.packageskey)" >> $GITHUB_OUTPUT
        shell: bash

      # Retrieve xmake dependencies
      - name: Restore cached xmake dependencies
        id: restore-depcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: ${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.platform.mode }}-${{ matrix.platform.runtime }}-${{ matrix.platform.toolchain }}-${{ steps.dep_hash.outputs.hash }}-W${{ steps.cache_key.outputs.key }}

      - name: Configure xmake and install dependencies
        run: xmake config -v --toolchain=${{ matrix.platform.toolchain }} --arch=${{ matrix.platform.arch }} --mode=${{ matrix.platform.mode }} --runtimes=${{ matrix.platform.runtime }} --yes --policies=package.precompiled:n

      # Save dependencies
      - name: Save cached xmake dependencies
        if: ${{ !steps.restore-depcache.outputs.cache-hit }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: ${{ steps.restore-depcache.outputs.cache-primary-key }}

      - name: Build all targets
        run: xmake build -vD -a

      # The install rules drop Assets next to the binary, so the target dir is the playable game.
      - name: Resolve target directory
        id: targetdir
        run: |
          target_file=$(XMAKE_COLORTERM=nocolor xmake show -t Pong | grep -m1 'targetfile:' | sed 's/.*targetfile: *//')
          echo "dir=$(dirname "$target_file")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Stage package shared libs (Unix)
        if: ${{ matrix.platform.os != 'windows' }}
        run: |
          find "${{ env.XMAKE_GLOBALDIR }}/.xmake/packages" \( -name "*.so*" -o -name "*.dylib" \) -exec cp -n {} "${{ steps.targetdir.outputs.dir }}/" \; 2>/dev/null || true
        shell: bash

      - name: Stage package shared libs (Windows)
        if: ${{ matrix.platform.os == 'windows' }}
        run: |
          $dest = "${{ steps.targetdir.outputs.dir }}"
          Get-ChildItem -Path "${{ env.XMAKE_GLOBALDIR }}\.xmake\packages" -Recurse -Filter "*.dll" |
            ForEach-Object { Copy-Item $_.FullName -Destination $dest -Force -ErrorAction SilentlyContinue }
        shell: pwsh

      - name: Install project targets
        run: |
          xmake install -vo dest/
          rm -rf dest/include/ dest/lib/
        shell: bash

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.platform.mode }}-${{ matrix.platform.toolchain }}-${{ matrix.platform.runtime }}
          path: |
            dest

      # --- Release packaging: a zip that runs straight out of the extracted folder ---
      - name: Package playable build (Unix)
        if: ${{ matrix.platform.release && matrix.platform.os != 'windows' }}
        run: |
          stage="package/${{ env.PACKAGE_NAME }}"
          mkdir -p "$stage"
          cp -R "${{ steps.targetdir.outputs.dir }}/." "$stage/"
          # Runtime leftovers from the build machine, not part of the game.
          rm -rf "$stage/logs" "$stage/context_config.toml" "$stage/.DS_Store" "$stage/compile_commands.json"
          chmod +x "$stage/Pong"
          cp README.md LICENSE "$stage/" 2>/dev/null || true
          cd package && zip -qr "../${{ env.PACKAGE_NAME }}.zip" "${{ env.PACKAGE_NAME }}"
        shell: bash

      - name: Package playable build (Windows)
        if: ${{ matrix.platform.release && matrix.platform.os == 'windows' }}
        run: |
          $stage = "package/${{ env.PACKAGE_NAME }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "${{ steps.targetdir.outputs.dir }}/*" -Destination $stage -Recurse -Force
          foreach ($leftover in @("logs", "context_config.toml", "compile_commands.json")) {
            Remove-Item -Path (Join-Path $stage $leftover) -Recurse -Force -ErrorAction SilentlyContinue
          }
          Copy-Item -Path "README.md","LICENSE" -Destination $stage -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath "${{ env.PACKAGE_NAME }}.zip" -Force
        shell: pwsh

      - name: Upload playable package
        if: ${{ matrix.platform.release }}
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download playable packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-Pong-*
          path: packages
          merge-multiple: true

      - name: List packages
        run: ls -lh packages

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.zip
          generate_release_notes: true
          body: |
            Download the zip for your platform, extract it anywhere and run the `Pong` executable.
            Everything the game needs ships inside the folder.

            | Platform | Download |
            | --- | --- |
            | Windows (x64) | `Pong-windows-x64.zip` |
            | Linux (x86_64) | `Pong-linux-x86_64.zip` |
            | macOS (Apple silicon) | `Pong-macos-arm64.zip` |

            **macOS:** the build is unsigned, so Gatekeeper quarantines it after download. Clear the
            flag once with `xattr -dr com.apple.quarantine Pong-macos-arm64` before running.

            **Linux:** needs a Vulkan driver for your GPU (`mesa-vulkan-drivers` or the vendor package).
