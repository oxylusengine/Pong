name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.mode.name }}-${{ matrix.platform.toolchain }}
    runs-on: ${{ matrix.platform.runner }}
    env:
      XMAKE_RUNTIME: ${{ matrix.platform.os == 'windows' && matrix.mode.windows_runtime || 'c++_static' }}
      PACKAGE_NAME: Pong-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
    strategy:
      fail-fast: false
      matrix:
        # Release builds are the ones that ship in a GitHub release. The static MSVC runtime keeps
        # the Windows zip free of redistributable DLLs.
        mode:
          - name: release
            windows_runtime: MT
          - name: debug
            windows_runtime: MTd
        # `xmake_plat` is xmake's own platform name, which is what the build directory is keyed on.
        platform:
          - runner: windows-2025
            os: windows
            arch: x64
            toolchain: msvc
            xmake_plat: windows
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
            toolchain: clang-23
            llvm_version: "23"
            xmake_plat: linux
          - runner: macos-26
            os: macos
            arch: arm64
            toolchain: mac-clang
            llvm_version: "23"
            llvm_formula: llvm
            xmake_plat: macosx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current week for cache key
        id: cache_key
        run: echo "key=$(date +'%G-W%V')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set xmake global directory
        run: echo "XMAKE_GLOBALDIR=${{ runner.temp }}/xmake-global" >> "$GITHUB_ENV"
        shell: bash

      # Derived from the matrix rather than asked of xmake: `xmake show -t Pong` exits non-zero on
      # the .rcss assets registered through install_resources, which trips `bash -e -o pipefail`.
      - name: Resolve target directory
        id: targetdir
        run: echo "dir=build/${{ matrix.platform.xmake_plat }}/${{ matrix.platform.arch }}/${{ matrix.mode.name }}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install Linux dependencies
        if: matrix.platform.os == 'linux'
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --yes -o /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-${{ matrix.platform.llvm_version }} main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ matrix.platform.llvm_version }} \
            lld-${{ matrix.platform.llvm_version }} \
            llvm-${{ matrix.platform.llvm_version }} \
            libc++-${{ matrix.platform.llvm_version }}-dev \
            libc++abi-${{ matrix.platform.llvm_version }}-dev \
            libunwind-${{ matrix.platform.llvm_version }}-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxrender-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev

      - name: Verify Linux LLVM
        if: matrix.platform.os == 'linux'
        run: clang-${{ matrix.platform.llvm_version }} --version

      - name: Set up Python
        if: matrix.platform.os == 'macos'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install macOS dependencies
        if: matrix.platform.os == 'macos'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          brew unlink simdjson || true

      - name: Install LLVM for macOS
        if: matrix.platform.os == 'macos'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          # Runner images preinstall an older llvm, and install is a no-op on it.
          brew update
          if brew list --versions ${{ matrix.platform.llvm_formula }} > /dev/null 2>&1; then
            brew upgrade ${{ matrix.platform.llvm_formula }}
          else
            brew install ${{ matrix.platform.llvm_formula }}
          fi
          brew unlink simdjson 2>/dev/null || true
          LLVM_PATH=$(brew --prefix ${{ matrix.platform.llvm_formula }})
          {
            echo "LLVM_PATH=$LLVM_PATH"
            echo "PATH=$LLVM_PATH/bin:$PATH"
            # clang 23 emits objc_msgSendClass stubs that Xcode 26.1's linker can't resolve, which
            # breaks SDL3. xmake passes no ObjC flags to cmake, but cmake reads this variable.
            echo "OBJCFLAGS=-fno-objc-msgsend-class-selector-stubs"
          } >> "$GITHUB_ENV"

      - name: Verify macOS LLVM
        if: matrix.platform.os == 'macos'
        run: |
          brew list --versions ${{ matrix.platform.llvm_formula }}
          "$LLVM_PATH/bin/clang++" --version
          if ! "$LLVM_PATH/bin/clang++" --version | grep -q "clang version ${{ matrix.platform.llvm_version }}\."; then
            echo "Expected clang ${{ matrix.platform.llvm_version }} from $LLVM_PATH." >&2
            echo "If homebrew-core has moved past ${{ matrix.platform.llvm_version }}, pin llvm_formula to llvm@${{ matrix.platform.llvm_version }}." >&2
            exit 1
          fi

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: .xmake-cache-${{ steps.cache_key.outputs.key }}

      - name: Update xmake repository
        run: xmake repo --update -vD

      - name: Retrieve dependencies hash
        id: dep_hash
        run: echo "hash=$(xmake l utils.ci.packageskey)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Restore cached xmake dependencies
        id: restore-depcache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: ${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.mode.name }}-${{ env.XMAKE_RUNTIME }}-${{ matrix.platform.toolchain }}${{ matrix.platform.llvm_version }}-${{ steps.dep_hash.outputs.hash }}-${{ steps.cache_key.outputs.key }}

      # Debug builds never ship, so they skip rcli (shader packs, asset cooking, layout check).
      - name: Configure xmake and install dependencies
        run: xmake config -v --toolchain=${{ matrix.platform.toolchain }} --arch=${{ matrix.platform.arch }} --mode=${{ matrix.mode.name }} --runtimes=${{ env.XMAKE_RUNTIME }} --compile_resources=${{ matrix.mode.name == 'release' && 'y' || 'n' }} --yes --policies=package.precompiled:n

      - name: Save cached xmake dependencies
        if: steps.restore-depcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: ${{ steps.restore-depcache.outputs.cache-primary-key }}

      # rcli runs during the build (the compile_shaders and cook_assets rules) and dlopens slang's
      # downstream compilers, so its shared deps have to be discoverable before anything is built.
      - name: Stage package shared libs (Unix)
        if: matrix.platform.os != 'windows'
        run: |
          pkglibs="${{ runner.temp }}/pkglibs"
          mkdir -p "$pkglibs"
          find "${{ env.XMAKE_GLOBALDIR }}/.xmake/packages" \( -name "*.so*" -o -name "*.dylib" \) -exec cp {} "$pkglibs/" \; 2>/dev/null || true
          echo "PKGLIBS=$pkglibs" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$pkglibs:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$pkglibs:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"
        shell: bash

      - name: Stage package shared libs (Windows)
        if: matrix.platform.os == 'windows'
        run: |
          $dest = "${{ steps.targetdir.outputs.dir }}"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # xmake vendors build-time tools into the same packages tree, and they drag in a whole
          # CPython (python3xx, tcl/tk, sqlite3, openssl, its own zlib1). None of it is a runtime
          # dep of the game, so skip those packages by path -- filtering on DLL name would also
          # throw away a genuine zlib1.dll from the zlib package.
          $toolPackages = '\\packages\\(c\\cmake|m\\(meson|msys2)|n\\(nasm|ninja)|p\\(python|pkgconf|perl)|s\\strawberry-perl|7\\7z|g\\git|r\\ruby|y\\yasm)\\'
          Get-ChildItem -Path "${{ env.XMAKE_GLOBALDIR }}\.xmake\packages" -Recurse -Filter "*.dll" |
            Where-Object { $_.FullName -notmatch $toolPackages } |
            ForEach-Object { Copy-Item $_.FullName -Destination $dest -Force -ErrorAction SilentlyContinue }
        shell: pwsh

      - name: Build all targets
        run: xmake build -vD -a

      # The install rules drop Assets next to the binary, so the target dir is the playable game.
      # It needs the shared libs alongside it too, for a zip that runs without env vars.
      - name: Bundle shared libs next to the binary (Unix)
        if: matrix.platform.os != 'windows'
        run: |
          dir="${{ steps.targetdir.outputs.dir }}"
          test -d "$dir" || { echo "::error::expected build output at $dir"; ls -R build || true; exit 1; }
          find "$PKGLIBS" -maxdepth 1 \( -name "*.so*" -o -name "*.dylib" \) -exec cp -n {} "$dir/" \; 2>/dev/null || true
        shell: bash

      - name: Install project targets
        run: |
          xmake install -vo dest/
          rm -rf dest/include/ dest/lib/
          if [ -n "$PKGLIBS" ]; then
            find "$PKGLIBS" -maxdepth 1 \( -name "*.so*" -o -name "*.dylib" \) -exec cp -n {} dest/bin/ \; 2>/dev/null || true
          fi
        shell: bash

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.mode.name }}-${{ matrix.platform.toolchain }}-${{ env.XMAKE_RUNTIME }}
          path: dest

      # --- Release packaging: a zip that runs straight out of the extracted folder ---
      - name: Package playable build (Linux)
        if: matrix.mode.name == 'release' && matrix.platform.os == 'linux'
        run: |
          stage="package/${{ env.PACKAGE_NAME }}"
          mkdir -p "$stage"
          cp -R "${{ steps.targetdir.outputs.dir }}/." "$stage/"
          # Runtime leftovers from the build machine, not part of the game.
          rm -rf "$stage/logs" "$stage/context_config.toml" "$stage/compile_commands.json"
          # The resource compiler toolchain is staged for rcli during the build. The game never
          # loads it, so it must not reach the zip.
          find "$stage" -maxdepth 1 \( -name '*slang*' -o -name '*SPIRV-Tools*' -o -name '*spirv-tools*' \
            -o -name '*ResourceCompiler*' -o -name 'rcli' \) -delete
          # Only the compiled packs are read at runtime, the .slang sources are build inputs.
          find "$stage/Assets/Shaders" -mindepth 1 ! -name '*.oxpack' -delete
          # Cooked assets load from .cooked, so their sources stay behind. A source is cooked when its
          # sidecar's uuid has a pack, and the sidecars themselves are editor-only.
          test -f "$stage/Assets/.cooked/assets.oxmanifest" || { echo "::error::no cooked asset manifest in $stage/Assets/.cooked"; exit 1; }
          find "$stage/Assets" -name '*.oxasset' -not -path '*/.cooked/*' | while IFS= read -r sidecar; do
            uuid=$(sed -n 's/.*"uuid": *"\([^"]*\)".*/\1/p' "$sidecar" | head -n 1)
            if [ -n "$uuid" ] && [ -f "$stage/Assets/.cooked/$uuid.oxpack" ]; then
              rm -f "${sidecar%.oxasset}"
            fi
            rm -f "$sidecar"
          done
          find "$stage/Assets" -mindepth 1 -type d -empty -delete
          chmod +x "$stage/Pong"
          cp README.md LICENSE "$stage/" 2>/dev/null || true
          cd package && zip -qr "../${{ env.PACKAGE_NAME }}.zip" "${{ env.PACKAGE_NAME }}"
        shell: bash

      - name: Package playable build (macOS)
        if: matrix.mode.name == 'release' && matrix.platform.os == 'macos'
        run: |
          stage="package/${{ env.PACKAGE_NAME }}"
          mkdir -p "$stage"
          cp -R "${{ steps.targetdir.outputs.dir }}/." "$stage/"
          # Runtime leftovers from the build machine, not part of the game.
          rm -rf "$stage/logs" "$stage/context_config.toml" "$stage/compile_commands.json"
          # Finder litters these through any directory it has looked at.
          find "$stage" -name '.DS_Store' -delete
          # The resource compiler toolchain is staged for rcli during the build. The game never
          # loads it, so it must not reach the zip.
          find "$stage" -maxdepth 1 \( -name '*slang*' -o -name '*SPIRV-Tools*' -o -name '*spirv-tools*' \
            -o -name '*ResourceCompiler*' -o -name 'rcli' \) -delete
          # Only the compiled packs are read at runtime, the .slang sources are build inputs.
          find "$stage/Assets/Shaders" -mindepth 1 ! -name '*.oxpack' -delete
          # Cooked assets load from .cooked, so their sources stay behind. A source is cooked when its
          # sidecar's uuid has a pack, and the sidecars themselves are editor-only.
          test -f "$stage/Assets/.cooked/assets.oxmanifest" || { echo "::error::no cooked asset manifest in $stage/Assets/.cooked"; exit 1; }
          find "$stage/Assets" -name '*.oxasset' -not -path '*/.cooked/*' | while IFS= read -r sidecar; do
            uuid=$(sed -n 's/.*"uuid": *"\([^"]*\)".*/\1/p' "$sidecar" | head -n 1)
            if [ -n "$uuid" ] && [ -f "$stage/Assets/.cooked/$uuid.oxpack" ]; then
              rm -f "${sidecar%.oxasset}"
            fi
            rm -f "$sidecar"
          done
          find "$stage/Assets" -mindepth 1 -type d -empty -delete
          chmod +x "$stage/Pong"
          cp README.md LICENSE "$stage/" 2>/dev/null || true
          # -X keeps resource forks and extra attributes out of the archive.
          cd package && zip -qrX "../${{ env.PACKAGE_NAME }}.zip" "${{ env.PACKAGE_NAME }}"
        shell: bash

      - name: Package playable build (Windows)
        if: matrix.mode.name == 'release' && matrix.platform.os == 'windows'
        run: |
          $stage = "package/${{ env.PACKAGE_NAME }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "${{ steps.targetdir.outputs.dir }}/*" -Destination $stage -Recurse -Force
          foreach ($leftover in @("logs", "context_config.toml", "compile_commands.json")) {
            Remove-Item -Path (Join-Path $stage $leftover) -Recurse -Force -ErrorAction SilentlyContinue
          }
          # The resource compiler toolchain is staged for rcli during the build. The game never
          # loads it, so it must not reach the zip.
          Get-ChildItem -Path $stage -File |
            Where-Object { $_.Name -match '(?i)slang|SPIRV-Tools|ResourceCompiler|^rcli' } |
            Remove-Item -Force
          # Only the compiled packs are read at runtime, the .slang sources are build inputs.
          $shaders = Join-Path $stage "Assets/Shaders"
          Get-ChildItem -Path $shaders -Recurse -File |
            Where-Object { $_.Extension -ne ".oxpack" } | Remove-Item -Force
          Get-ChildItem -Path $shaders -Recurse -Directory |
            Sort-Object { $_.FullName.Length } -Descending |
            Where-Object { -not (Get-ChildItem $_.FullName -Force) } | Remove-Item -Force
          # Cooked assets load from .cooked, so their sources stay behind. A source is cooked when its
          # sidecar's uuid has a pack, and the sidecars themselves are editor-only.
          $assets = Join-Path $stage "Assets"
          $cooked = Join-Path $assets ".cooked"
          if (-not (Test-Path (Join-Path $cooked "assets.oxmanifest"))) {
            Write-Error "no cooked asset manifest in $cooked"
            exit 1
          }
          Get-ChildItem -Path $assets -Recurse -File -Filter "*.oxasset" |
            Where-Object { $_.FullName -notmatch '[\\/]\.cooked[\\/]' } |
            ForEach-Object {
              $uuid = (Get-Content $_.FullName -Raw | ConvertFrom-Json).uuid
              if ($uuid -and (Test-Path (Join-Path $cooked "$uuid.oxpack"))) {
                Remove-Item -Path ($_.FullName -replace '\.oxasset$', '') -Force -ErrorAction SilentlyContinue
              }
              Remove-Item -Path $_.FullName -Force
            }
          Get-ChildItem -Path $assets -Recurse -Directory |
            Sort-Object { $_.FullName.Length } -Descending |
            Where-Object { -not (Get-ChildItem $_.FullName -Force) } | Remove-Item -Force
          Copy-Item -Path "README.md","LICENSE" -Destination $stage -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath "${{ env.PACKAGE_NAME }}.zip" -Force
        shell: pwsh

      - name: Upload playable package
        if: matrix.mode.name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download playable packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-Pong-*
          path: packages
          merge-multiple: true

      - name: List packages
        run: ls -lh packages

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.zip
          generate_release_notes: true
          body: |
            Download the zip for your platform, extract it anywhere and run the `Pong` executable.
            Everything the game needs ships inside the folder.

            | Platform | Download |
            | --- | --- |
            | Windows (x64) | `Pong-windows-x64.zip` |
            | Linux (x86_64) | `Pong-linux-x86_64.zip` |
            | macOS (Apple silicon) | `Pong-macos-arm64.zip` |

            **macOS:** the build is unsigned, so Gatekeeper quarantines it after download. Clear the
            flag once with `xattr -dr com.apple.quarantine Pong-macos-arm64` before running.

            **Linux:** needs a Vulkan driver for your GPU (`mesa-vulkan-drivers` or the vendor package).
